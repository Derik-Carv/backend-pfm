services:
    postgres:
        restart: always
        ports: !override []
        environment:
            POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
            POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}

    backend:
        build:
            target: production
        restart: always
        ports: !override
            - "127.0.0.1:${PORT:?PORT is required}:${PORT:?PORT is required}"
        volumes:
            - nf_archives:/usr/src/app/archives
        command:
            ["bun", "run", "dist/server.js"]
        healthcheck:
            test: ["CMD", "bun", "-e", "const r=await fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/public/health'); if (!r.ok) process.exit(1)"]
            interval: 30s
            timeout: 5s
            retries: 3
            start_period: 20s

volumes:
    nf_archives:
