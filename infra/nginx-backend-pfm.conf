# Nginx reverse proxy template for Backend PFM on Oracle Cloud Micro (1 OCPU / 1 GB RAM).
# Adjust `server_name` and TLS certificate paths, then place under /etc/nginx/sites-available/
# and test with `sudo nginx -t && sudo systemctl reload nginx`.

limit_req_zone $binary_remote_addr zone=pfm_api_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=pfm_api_sensitive:10m rate=1r/s;
limit_conn_zone $binary_remote_addr zone=pfm_conn_per_ip:10m;
limit_req_status 429;
limit_conn_status 429;

upstream pfm_backend {
    server 127.0.0.1:3336;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.seu-dominio.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name api.seu-dominio.com;

    ssl_certificate /etc/letsencrypt/live/api.seu-dominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.seu-dominio.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 11m;
    limit_conn pfm_conn_per_ip 20;

    # Compression for JSON/text responses (saves bandwidth and client latency)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        text/plain
        text/css
        text/xml
        application/xml;

    # Edge security headers (complementing Fastify Helmet)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    # Block common internet bot scans at the edge before reaching Bun/Fastify
    location ~* ^/(\.env|\.git|wp-login\.php|wp-admin|xmlrpc\.php|vpnsvc/|cgi-bin/) {
        access_log off;
        return 444;
    }

    location ~* \.php$ {
        access_log off;
        return 444;
    }

    # NOTE: With Nginx directly exposed to the internet (no Cloudflare/WAF in front),
    # pass $remote_addr so clients cannot spoof X-Forwarded-For. If a trusted proxy/WAF
    # sits in front later, configure `set_real_ip_from` + `real_ip_header` and restore
    # `$proxy_add_x_forwarded_for`.
    location = / {
        if ($request_method = POST) {
            return 444;
        }
        limit_req zone=pfm_api_general burst=20 nodelay;
        proxy_pass http://pfm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Stricter edge rate limiting for authentication, password recovery and onboarding
    location ~ ^/public/(login|password|company-requests) {
        limit_req zone=pfm_api_sensitive burst=5 nodelay;
        proxy_pass http://pfm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 35s;
    }

    # Stream NF PDFs without buffering full files in Nginx RAM
    location ~ ^/(notes|nf)/[^/]+/file$ {
        limit_req zone=pfm_api_general burst=20 nodelay;
        proxy_pass http://pfm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
    }

    location / {
        limit_req zone=pfm_api_general burst=20 nodelay;
        proxy_pass http://pfm_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 35s;
    }
}
